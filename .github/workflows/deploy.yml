name: Build and Deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ================================================================
      # droneduca.es — web corporativa (todo excepto cursos/campus/
      # login/registro/admin)
      # ================================================================
      - name: Build marketing site (droneduca.es)
        run: npm run build
        env:
          SITE_URL: https://droneduca.es
          PUBLIC_SITE_TARGET: marketing
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy marketing site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          exclude: |
            **/cursos/**
            **/campus/**
            **/login/**
            **/registro/**
            **/admin/**

      # ================================================================
      # formacion.droneduca.es (public_html/formacion) — catálogo,
      # campus, login, registro.
      # admin.droneduca.es (public_html/admin) — panel de administración.
      # Ambos subdominios son subcarpetas del mismo public_html, así que
      # usan las mismas credenciales FTP que la web principal.
      # ================================================================
      - name: Build app site (formacion.droneduca.es)
        run: npm run build
        env:
          SITE_URL: https://formacion.droneduca.es
          PUBLIC_SITE_TARGET: formacion
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy cursos
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/cursos/
          server-dir: ./public_html/formacion/cursos/

      - name: Deploy campus
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/campus/
          server-dir: ./public_html/formacion/campus/

      - name: Deploy login
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/login/
          server-dir: ./public_html/formacion/login/

      - name: Deploy registro
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/registro/
          server-dir: ./public_html/formacion/registro/

      - name: Stage robots.txt on its own
        run: |
          mkdir -p ./dist-formacion-robots
          cp ./dist/robots.txt ./dist-formacion-robots/robots.txt

      - name: Deploy robots.txt (formación)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist-formacion-robots/
          server-dir: ./public_html/formacion/

      - name: Deploy admin panel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/admin/
          server-dir: ./public_html/admin/

      - name: Deploy robots.txt (admin, disallow all)
        run: |
          mkdir -p ./dist-admin-robots
          printf "User-agent: *\nDisallow: /\n" > ./dist-admin-robots/robots.txt

      - name: Deploy robots.txt (admin)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist-admin-robots/
          server-dir: ./public_html/admin/

      # ================================================================
      # _astro (CSS/JS compilados), brand/, favicon, etc. — cursos,
      # campus, login, registro y admin comparten estos archivos, así
      # que se copian también a formacion/ y a admin/ (en la carpeta de
      # marketing ya se han subido en el primer build de más arriba).
      # ================================================================
      - name: Stage shared static assets
        run: |
          mkdir -p ./dist-shared-assets
          cp -r ./dist/_astro ./dist-shared-assets/_astro
          cp -r ./dist/brand ./dist-shared-assets/brand
          cp ./dist/favicon.png ./dist-shared-assets/favicon.png
          cp ./dist/favicon.svg ./dist-shared-assets/favicon.svg
          cp ./dist/apple-touch-icon.png ./dist-shared-assets/apple-touch-icon.png
          cp ./dist/og-image.svg ./dist-shared-assets/og-image.svg

      - name: Deploy shared assets (formación)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist-shared-assets/
          server-dir: ./public_html/formacion/

      - name: Deploy shared assets (admin)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist-shared-assets/
          server-dir: ./public_html/admin/
