name: Build and Deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ================================================================
      # droneduca.es — web corporativa (todo excepto cursos/campus/
      # login/registro/admin)
      # ================================================================
      - name: Build marketing site (droneduca.es)
        run: npm run build
        env:
          SITE_URL: https://droneduca.es
          PUBLIC_SITE_TARGET: marketing
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          # Solo este build genera /galeria/[slug] (ver getStaticPaths ahí) — necesita la service-role key
          # para leer galleries/gallery_items, que no tienen ninguna policy de lectura pública por RLS.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy marketing site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          exclude: |
            **/cursos/**
            **/campus/**
            **/login/**
            **/registro/**
            **/admin/**

      # ================================================================
      # formacion.droneduca.es (public_html/formacion) — catálogo,
      # campus, login, registro.
      # admin.droneduca.es (public_html/admin) — panel de administración.
      # Ambos subdominios son subcarpetas del mismo public_html, así que
      # usan las mismas credenciales FTP que la web principal.
      #
      # IMPORTANTE: cada subdominio se sube en UN SOLO paso de FTP (todo
      # lo que necesita, ya combinado en una carpeta local antes). Si dos
      # pasos de FTP-Deploy-Action apuntan a la misma server-dir por
      # separado, el segundo borra lo que subió el primero (el estado de
      # sincronización de la acción no sabe que ese archivo "es suyo").
      # ================================================================
      - name: Build app site (formacion.droneduca.es)
        run: npm run build
        env:
          SITE_URL: https://formacion.droneduca.es
          PUBLIC_SITE_TARGET: formacion
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Stage formacion.droneduca.es
        run: |
          mkdir -p ./dist-formacion
          cp -r ./dist/cursos ./dist-formacion/cursos
          cp -r ./dist/campus ./dist-formacion/campus
          cp -r ./dist/login ./dist-formacion/login
          cp -r ./dist/registro ./dist-formacion/registro
          cp -r ./dist/_astro ./dist-formacion/_astro
          cp -r ./dist/brand ./dist-formacion/brand
          cp ./dist/robots.txt ./dist-formacion/robots.txt
          cp ./dist/favicon.png ./dist-formacion/favicon.png
          cp ./dist/favicon.svg ./dist-formacion/favicon.svg
          cp ./dist/apple-touch-icon.png ./dist-formacion/apple-touch-icon.png
          cp ./dist/og-image.svg ./dist-formacion/og-image.svg
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=/cursos"><a href="/cursos">Ir a los cursos</a>' > ./dist-formacion/index.html

      - name: Deploy formacion.droneduca.es
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist-formacion/
          server-dir: ./public_html/formacion/

      - name: Stage admin.droneduca.es
        run: |
          mkdir -p ./dist-admin
          cp -r ./dist/admin/. ./dist-admin/
          cp -r ./dist/_astro ./dist-admin/_astro
          cp -r ./dist/brand ./dist-admin/brand
          cp ./dist/favicon.png ./dist-admin/favicon.png
          cp ./dist/favicon.svg ./dist-admin/favicon.svg
          cp ./dist/apple-touch-icon.png ./dist-admin/apple-touch-icon.png
          cp ./dist/og-image.svg ./dist-admin/og-image.svg
          printf "User-agent: *\nDisallow: /\n" > ./dist-admin/robots.txt

      - name: Deploy admin.droneduca.es
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist-admin/
          server-dir: ./public_html/admin/
